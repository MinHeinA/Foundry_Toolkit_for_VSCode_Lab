[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careers-job-mcp"
version = "1.0.0"
description = "Read-only Careers@Gov MCP and REST workshop service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4==4.14.3",
  "fastapi==0.141.1",
  "mcp==1.29.0",
  "uvicorn==0.52.1",
]

[project.scripts]
careers-build-index = "careers_job_mcp.build_index:main"
careers-job-mcp = "careers_job_mcp.__main__:main"

[tool.setuptools.package-data]
careers_job_mcp = ["schema.sql"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
