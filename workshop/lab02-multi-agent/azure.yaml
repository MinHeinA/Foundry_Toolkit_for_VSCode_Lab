# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: personal-career-copilot
services:
  personal-career-copilot:
    host: azure.ai.agent
    project: PersonalCareerCopilotStarter
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    kind: hosted
    name: personal-career-copilot
    description: >
      A Resume to Job Fit Evaluator that retrieves an explicitly selected
      Careers@Gov listing and generates a grounded fit assessment and learning
      roadmap.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: CAREERS_MCP_ENDPOINT
        value: ${CAREERS_MCP_ENDPOINT}
      - name: CAREERS_MCP_API_KEY
        value: ${CAREERS_MCP_API_KEY}
      - name: CAREERS_MCP_TIMEOUT_SECONDS
        value: ${CAREERS_MCP_TIMEOUT_SECONDS}
      - name: MICROSOFT_LEARN_MCP_ENDPOINT
        value: ${MICROSOFT_LEARN_MCP_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
